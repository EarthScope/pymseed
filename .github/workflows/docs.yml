name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install pymseed with docs dependencies
        run: uv pip install --system .[docs]

      - name: Sanity check the built extension
        run: python -c "import pymseed; print(pymseed.__version__)"

      - name: Build HTML
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Run documentation doctests
        run: sphinx-build -b doctest docs docs/_build/doctest

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  linkcheck:
    name: Check external links
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install pymseed with docs dependencies
        run: uv pip install --system .[docs]

      - name: Check links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
